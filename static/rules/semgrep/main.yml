rules:
  - id: python.assert-in-production
    languages: [python]
    message: "Avoid using bare 'assert' for runtime checks; use explicit exceptions (ValueError, FileNotFoundError, etc.) instead because assertions can be disabled."
    severity: ERROR
    patterns:
      - pattern: assert $X
    paths:
      exclude:
        - "tests/**"
        - "**/tests/**"
