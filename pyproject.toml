[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "adrift"
version = "0.1.0"
description = "Podcast source aggregation and reference alignment"
authors = []
package-mode = true
packages = [{ include = "adrift" }]

[tool.poetry.scripts]
adrift = "adrift.cli.root:main"
adrift-cleanup = "adrift.cli.cleanup:main"
adrift-download = "adrift.cli.download:main"
adrift-merge = "adrift.cli.merge:main"
adrift-schema = "adrift.cli.schema:main"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
attrs = "~=26.1.0"
pydantic = "~=2.12.5"
feedparser = "~=6.0.12"
python-dotenv = "~=1.2.2"
requests = "~=2.33.1"
tqdm = "~=4.67.3"
yt-dlp = "~=2026.3.17"
rapidfuzz = "~=3.14.3"
numpy = "~=2.4.4"
unidecode = "~=1.4.0"
cachetools = "~=7.0.5"
diskcache = "~=5.6.3"
yarl = "~=1.23.0"
python-dateutil = "~=2.9.0.post0"
rich = "~=15.0.0"
typer = "^0.24.1"

[tool.poetry.group.dev.dependencies]
# Type stubs
types-tqdm = "~=4.67.3.20260402"
types-cachetools = "~=6.2.0.20260317"
types-yt-dlp = "~=2026.3.17.20260402"
# Linting & formatting
ruff = "~=0.15.9"
ast-grep-cli = "~=0.44.1"
# Testing
pytest = "~=9.0.2"
# Quality tools
ty = "^0.0.32"
lizard = "~=1.21.3"
vulture = "~=2.16"
setuptools = ">=75.0,<81"
pyinstrument = "^5.1.2"
maturin = "^1.8.0"
hypothesis = "^6.153.0"
import-linter = ">=2.0"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks slower integration-oriented tests (run with -m slow)",
    "perf: performance benchmarks (run via: RUN_PERF_TESTS=1 pytest tests/benchmarks/)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# S101 bans bare `assert` outside tests; use explicit exceptions since
# assertions can be disabled with -O.
select = ["E", "F", "I", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"conftest.py" = ["S101"]

[tool.ty.environment]
# Explicitly point at the project venv so `ty` resolves third-party packages
# correctly regardless of the caller's VIRTUAL_ENV setting.
python = ".venv/bin/python"
python-version = "3.11"
extra-paths = []
root = ["."]

[tool.ty.src]
include = ["adrift"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
error-on-warning = false
output-format = "full"

[tool.ty.rules]
# Enforce strict typing by default.
all = "error"

[tool.vulture]
paths = ["adrift"]
min_confidence = 80

[tool.importlinter]
root_package = "adrift"

# Dependency graph:
#   User → CLI → Services → Models
#                         → Adapters → Utils → (external)
#          CLI → Utils
#
# Contract: Layered architecture — cli > services > adapters > models > utils.
# Higher layers may import lower ones only; adapters read env config
# directly (os.getenv) rather than importing services.config.

[[tool.importlinter.contracts]]
name = "dependency-layering"
type = "layers"
layers = [
    "adrift.cli",
    "adrift.services",
    "adrift.adapters",
    "adrift.models",
    "adrift.utils",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/adrift_rust_alignment/Cargo.toml"
module-name = "adrift_rust_alignment"
