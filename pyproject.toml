[build-system]
# Sanctioned divergence from the scaffold standard's `uv_build`: adrift ships
# an in-process PyO3 extension (rust/adrift_rust_alignment/) compiled via
# maturin. uv_build is pure Python and cannot compile native code, so it
# cannot replace hatchling here without giving up the in-process fast path.
# See docs/.PLAN.md D3a.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adrift"
version = "0.1.0"
description = "Podcast source aggregation and reference alignment"
authors = []
requires-python = ">=3.11,<4.0"
dependencies = [
    "attrs~=26.1.0",
    "pydantic~=2.12.5",
    "feedparser~=6.0.12",
    "python-dotenv~=1.2.2",
    "requests~=2.33.1",
    "tqdm~=4.67.3",
    "yt-dlp~=2026.3.17",
    "rapidfuzz~=3.14.3",
    "numpy~=2.4.4",
    "unidecode~=1.4.0",
    "cachetools~=7.0.5",
    "diskcache~=5.6.3",
    "yarl~=1.23.0",
    "python-dateutil~=2.9.0.post0",
    "rich~=15.0.0",
    "typer>=0.24.1,<0.25.0",
    "typing-extensions~=4.16.0",
]

[project.scripts]
adrift = "adrift.cli.root:main"
adrift-cleanup = "adrift.cli.cleanup:main"
adrift-download = "adrift.cli.download:main"
adrift-merge = "adrift.cli.merge:main"
adrift-schema = "adrift.cli.schema:main"

[dependency-groups]
dev = [
    # Type stubs
    "types-tqdm~=4.67.3.20260402",
    "types-cachetools~=6.2.0.20260317",
    "types-yt-dlp~=2026.3.17.20260402",
    # Linting & formatting -- pinned to the scaffold framework series (see
    # docs/.PLAN.md Phase 1) so this project lints identically to a freshly
    # scaffolded one.
    "ruff==0.15.*",
    "ty==0.0.59",
    "pytest==9.1.*",
    "import-linter==2.13.*",
    "vulture==2.16.*",
    # ast-grep-cli/lizard are kept until Phase 3 replaces tests/test_lint.py
    # (which still shells out to both); D4/D5 retire them at that point.
    "ast-grep-cli~=0.44.1",
    "lizard~=1.21.3",
    # Intentional extras retained per docs/.PLAN.md D3/D6.
    "pyinstrument>=5.1.2,<6.0.0",
    "maturin>=1.8.0,<2.0.0",
    "hypothesis>=6.153.0,<7.0.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks slower integration-oriented tests (run with -m slow)",
    "perf: performance benchmarks (run via: RUN_PERF_TESTS=1 pytest tests/benchmarks/)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# S101 bans bare `assert` outside tests; use explicit exceptions since
# assertions can be disabled with -O.
# NOTE: intentionally not yet `select = ["ALL"]` per docs/.PLAN.md Phase 1 --
# the pydocstyle/mccabe/pylint config below is staged ahead of that flip so
# Phase 3 only needs to change `select` and pay down the resulting findings.
select = ["E", "F", "I", "S101"]

[tool.ruff.lint.per-file-ignores]
# The tail entries in each list (beyond S101) are inert today -- they only
# take effect once `select` flips to `ALL` in Phase 3 -- and are staged here
# so that flip does not require touching this table.
"tests/**" = ["S101", "S", "PLR2004", "ANN", "D", "INP001", "SLF001"]
"conftest.py" = ["S101"]
"adrift/cli/**" = ["T20", "B008", "FBT001", "FBT002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 5
max-statements = 40

[tool.ty.environment]
# Explicitly point at the project venv so `ty` resolves third-party packages
# correctly regardless of the caller's VIRTUAL_ENV setting.
python = ".venv/bin/python"
python-version = "3.11"
extra-paths = []
root = ["."]

[tool.ty.src]
include = ["adrift"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
error-on-warning = false
output-format = "full"

[tool.ty.rules]
# Enforce strict typing by default.
all = "error"

[tool.vulture]
paths = ["adrift"]
min_confidence = 80

[tool.importlinter]
root_package = "adrift"

# Dependency graph:
#   User → CLI → Services → Models
#                         → Adapters → Utils → (external)
#          CLI → Utils
#
# Contract: Layered architecture — cli > services > adapters > models > utils.
# Higher layers may import lower ones only; adapters read env config
# directly (os.getenv) rather than importing services.config.

[[tool.importlinter.contracts]]
name = "dependency-layering"
type = "layers"
layers = [
    "adrift.cli",
    "adrift.services",
    "adrift.adapters",
    "adrift.models",
    "adrift.utils",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/adrift_rust_alignment/Cargo.toml"
module-name = "adrift_rust_alignment"
